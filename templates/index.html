<!doctype html>
<html>
  <head>
    <title>ToDo App</title>
  </head>
  <body>
    <h1>My ToDo list</h1>

    <from action="/add" method="post">
      <input type="text" name="task" placeholder="Enter a new task" />
      <button type="submit">Add</button>
    </from>

    <ul>
      {% for task in tasks %}
      <li>
        {{ task }}
        <a href="/delete/{{ loop.index0 }}">Delete</a>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
